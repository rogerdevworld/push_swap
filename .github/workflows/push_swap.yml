name: push_swap tester

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build push_swap
      run: make

    - name: Clone and Run Tester (rogerdevworld/push_swap_tester)
      run: |
        git clone https://github.com/rogerdevworld/push_swap_tester.git
        cd push_swap_tester
        bash tester_push_swap.sh
